services:
  codex-web:
    image: ${IMAGE_NAME:-codex-web:local}
    container_name: ${CONTAINER_NAME:-codex-web}
    labels:
      io.codex-web.managed: "true"
    init: true
    restart: unless-stopped
    ports:
      - "${WEB_BIND_ADDRESS:-0.0.0.0}:${WEB_PORT:-8080}:8080"
    env_file: .env
    volumes:
      - workspace:/workspace
      - codex-home:/home/codex/.codex
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: ${PIDS_LIMIT:-128}
    mem_limit: ${MEMORY_LIMIT:-384m}
    memswap_limit: ${MEMORY_LIMIT:-384m}
    cpus: ${CPU_LIMIT:-0.75}
    logging:
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  workspace:
    name: ${WORKSPACE_VOLUME:-codex-web-workspace}
  codex-home:
    name: ${CODEX_HOME_VOLUME:-codex-web-home}
